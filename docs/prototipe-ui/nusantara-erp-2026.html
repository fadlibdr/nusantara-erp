<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipe UI — Nusantara ERP 2026</title>
<style>
/* ============================================================= CHROME
   Kerangka peninjauan. Ini BUKAN bagian dari aplikasi: ia hanya bingkai
   yang memuat dokumen prototipe di dalam <iframe>, supaya @media di
   dalamnya mengukur lebar bingkai — bukan lebar jendela peninjau.
   Tanpa iframe, "390 px" hanya akan mengecilkan kotak tanpa pernah
   menyalakan satu pun aturan ponsel. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #11161d;
  color: #d7dde5;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.bar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 16px;
  background: #171e27;
  border-bottom: 1px solid #262f3b;
}
.bar h1 { font-size: 13px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.bar h1 span { color: #7c8899; font-weight: 400; }
.grp { display: flex; align-items: center; gap: 6px; }
.grp > b { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f7c8d; margin-right: 2px; }
.seg { display: flex; border: 1px solid #2d3745; border-radius: 7px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 12px;
  padding: 5px 11px; border: 0; background: transparent; color: #98a5b5; cursor: pointer;
}
.seg button + button { border-left: 1px solid #2d3745; }
.seg button:hover { background: #202a36; color: #e4ebf3; }
.seg button[aria-pressed="true"] { background: #2563eb; color: #fff; }
.bar .note { font-size: 11.5px; color: #64707f; margin-left: auto; }
.wrap { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 0; }
.idx { border-right: 1px solid #262f3b; background: #141a22; overflow-y: auto; padding: 12px 10px 28px; }
.idx b { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #6f7c8d; margin: 14px 8px 5px; }
.idx b:first-child { margin-top: 2px; }
.idx button {
  display: block; width: 100%; text-align: left;
  font: inherit; font-size: 12.5px;
  padding: 6px 9px; margin-bottom: 1px;
  border: 0; border-radius: 6px; background: transparent; color: #9fadbe; cursor: pointer;
}
.idx button:hover { background: #1e2731; color: #e4ebf3; }
.idx button[aria-current="true"] { background: #1e3a8a; color: #fff; font-weight: 600; }
.stage { min-width: 0; overflow: auto; padding: 18px; display: grid; justify-items: center; align-content: start; }
.frame {
  width: 100%;
  background: #fff;
  border: 1px solid #2d3745;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  transition: width .18s ease;
}
.frame.w1440 { width: 1440px; } .frame.w1024 { width: 1024px; }
.frame.w768  { width: 768px; }  .frame.w390  { width: 390px; }
.frame iframe { display: block; width: 100%; height: 820px; border: 0; background: #fff; }
.frame.w390 iframe { height: 780px; }
@media (max-width: 900px) {
  /* Indeks menjadi satu jalur mendatar, bukan hilang: menyembunyikannya
     membuat prototipe ini tidak bisa ditelusuri sama sekali di ponsel. */
  .wrap { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .idx { border-right: 0; border-bottom: 1px solid #262f3b; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
  .idx b { display: none; }
  .idx button { width: auto; white-space: nowrap; margin: 0; }
  .stage { padding: 12px; }
}
</style>
</head>
<body>

<div class="bar">
  <h1>Prototipe UI <span>· Nusantara ERP 2026</span></h1>
  <div class="grp"><b>Tema</b><div class="seg" id="seg-theme">
    <button data-v="light" aria-pressed="true">Terang</button>
    <button data-v="dark" aria-pressed="false">Gelap</button>
    <button data-v="system" aria-pressed="false">Sistem</button>
  </div></div>
  <div class="grp"><b>Kepadatan</b><div class="seg" id="seg-density">
    <button data-v="compact" aria-pressed="false">Padat</button>
    <button data-v="normal" aria-pressed="true">Normal</button>
    <button data-v="comfortable" aria-pressed="false">Lega</button>
  </div></div>
  <div class="grp"><b>Lebar</b><div class="seg" id="seg-width">
    <button data-v="1440" aria-pressed="true">1440</button>
    <button data-v="1024" aria-pressed="false">1024</button>
    <button data-v="768" aria-pressed="false">768</button>
    <button data-v="390" aria-pressed="false">390</button>
  </div></div>
  <span class="note">Mockup statis — tanpa API, tanpa kerangka kerja, tanpa CDN.</span>
</div>

<div class="wrap">
  <nav class="idx" id="idx"></nav>
  <div class="stage"><div class="frame w1440" id="frame"><iframe id="app" title="Pratinjau Nusantara ERP"></iframe></div></div>
</div>

<script id="doc-css" type="text/plain">
/* =====================================================================
   NUSANTARA ERP — sistem token yang diusulkan (UI-1)
   Apa yang BARU dibanding app.css hari ini ditandai [BARU].
   Nilai warna TIDAK diubah: palet, aksen ΔE dan token grafik tetap
   persis seperti yang sudah tervalidasi. Yang ditambahkan adalah skala
   yang selama ini tidak ada — jarak, tipografi, radius, cincin fokus —
   supaya 873 angka px mentah punya tempat untuk pulang.
   ===================================================================== */
:root {
  /* --- permukaan ------------------------------------------------- */
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --surface-3: #f1f3f6;
  --surface-sidebar: #ffffff;   /* [BARU] peran, bukan warna baru      */
  --surface-header: #ffffff;    /* [BARU]                              */
  --surface-hover: #f1f3f6;     /* [BARU] = --surface-3                */
  --surface-selected: #e8effc;  /* [BARU] = --primary-soft             */
  /* --- tepi ------------------------------------------------------- */
  --border: #e2e6eb;
  --border-strong: #cbd2da;
  /* --- teks ------------------------------------------------------- */
  --text: #14181d;
  --text-2: #47505b;
  --muted: #5e6874;
  /* --- merek & semantik (TIDAK diubah) ---------------------------- */
  --primary: #1a56db; --primary-hover: #1745b0; --primary-soft: #e8effc; --primary-fg: #ffffff;
  --danger: #c62828;  --danger-soft: #fdecec;
  --success: #17714a; --success-soft: #e6f4ec;
  --warning: #96601a; --warning-soft: #fdf1dd;
  --info: #1f5f8b;    --info-soft: #e7f1f8;
  --neutral: #5a6472; --neutral-soft: #eef0f3;
  /* --- [BARU] skala jarak: 4 / 8 / 12 / 16 / 20 / 24 / 32 --------- */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px;
  /* --- [BARU] skala tipografi ------------------------------------
     Lantai 11 px dipertahankan (S8 smallest_font_px). Angka 12,5 /
     11,5 / 13,5 yang berserak di 126 deklarasi dilebur ke enam nama. */
  --fs-caption: 11px;    /* keterangan, label kolom, eyebrow          */
  --fs-secondary: 12px;  /* teks pendukung, sub-sel                   */
  --fs-label: 12px;      /* label field                               */
  --fs-body: 13px;       /* teks isi — ukuran kerja aplikasi          */
  --fs-table: 13px;      /* sel tabel                                 */
  --fs-section: 14px;    /* judul kartu / seksi (dulu 13,5)           */
  --fs-page: 20px;       /* judul halaman                             */
  --fs-kpi: 22px;        /* angka KPI                                 */
  --lh-tight: 1.25; --lh-body: 1.5;
  --fw-medium: 500; --fw-semi: 600; --fw-bold: 700;
  --tracking-caps: .06em;
  /* --- radius ----------------------------------------------------- */
  --radius-sm: 6px;   /* kontrol: tombol, input, baris menu           */
  --radius: 8px;      /* kartu, panel                                 */
  --radius-lg: 12px;  /* [BARU] modal, laci, permukaan besar          */
  --radius-pill: 999px; /* [BARU] lencana, chip                       */
  /* --- elevasi: HANYA untuk lapisan melayang ---------------------- */
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-md: 0 4px 12px rgba(16,24,40,.1), 0 2px 4px rgba(16,24,40,.06);
  --shadow-lg: 0 18px 48px rgba(16,24,40,.18);
  /* --- [BARU] satu cincin fokus, bukan empat salinan -------------- */
  --focus-ring: 0 0 0 3px var(--primary-soft);
  /* --- tata letak ------------------------------------------------- */
  --sidebar-w: 250px;
  --drawer-w: 264px;   /* [BARU] dulu 264px tertulis mentah di @media */
  --header-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* --- kepadatan: DIBEKUKAN (keputusan pemilik) ------------------- */
  --row-h: 38.5px; --cell-py: 9px; --cell-px: 12px; --foot-py: 10px;
  --nav-py: 6px; --form-gap: 13px 16px; --kv-gap: 9px 14px;
  /* --- aksen modul (TIDAK diubah) --------------------------------- */
  --accent-1: #1a56db; --accent-1-soft: #edf1fc; --accent-1-fg: #ffffff;
  --accent-2: #c43e05; --accent-2-soft: #faf0eb; --accent-2-fg: #ffffff;
  --accent-3: #007d3d; --accent-3-soft: #e8f3ee; --accent-3-fg: #ffffff;
  --accent-4: #9000c6; --accent-4-soft: #f7edfb; --accent-4-fg: #ffffff;
  --accent-5: #00758f; --accent-5-soft: #ebf4f6; --accent-5-fg: #ffffff;
  --accent-6: #970e2a; --accent-6-soft: #f8eef0; --accent-6-fg: #ffffff;
  --accent-7: #926100; --accent-7-soft: #f6f2eb; --accent-7-fg: #ffffff;
  --accent-8: #4a505c; --accent-8-soft: #f1f1f2; --accent-8-fg: #ffffff;
  /* --- grafik (TIDAK diubah) -------------------------------------- */
  --chart-1: #1a56db; --chart-2: #c2410c; --chart-3: #15803d; --chart-4: #7e22ce;
  --chart-5: #0e7490; --chart-6: #b91c1c; --chart-7: #a16207; --chart-8: #475569;
  --chart-grid: #e2e6eb; --chart-axis: #cbd2da; --chart-text: #5e6874;
  --chart-baseline: #94a3b8; --chart-today: #c62828; --chart-weekend: #f1f3f6;
}

:root[data-density="compact"] {
  --row-h: 32px; --cell-py: 3px; --cell-px: 10px; --foot-py: 4px;
  --nav-py: 4px; --form-gap: 9px 14px; --kv-gap: 5px 12px;
}
:root[data-density="comfortable"] {
  --row-h: 48px; --cell-py: 9px; --cell-px: 14px; --foot-py: 10px;
  --nav-py: 8px; --form-gap: 16px 18px; --kv-gap: 12px 16px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117;
  --surface: #151a21;
  --surface-2: #1a1f27;
  --surface-3: #212832;
  --surface-sidebar: #151a21;
  --surface-header: #151a21;
  --surface-hover: #212832;
  --surface-selected: #17263f;
  --border: #262d38;
  --border-strong: #38414f;
  --text: #e7ebf0;
  --text-2: #b3bcc8;
  --muted: #8b95a3;
  --primary: #5b8def; --primary-hover: #7ba4f4; --primary-soft: #17263f; --primary-fg: #0d1117;
  --danger: #f87171;  --danger-soft: #331a1a;
  --success: #4ade80; --success-soft: #12291d;
  --warning: #fbbf24; --warning-soft: #2e2411;
  --info: #60a5fa;    --info-soft: #16243a;
  --neutral: #9aa4b2; --neutral-soft: #232a34;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,.45);
  --shadow-lg: 0 18px 48px rgba(0,0,0,.6);
  --accent-1: #5b8def; --accent-1-soft: #1b2434; --accent-1-fg: #0d1117;
  --accent-2: #f9913c; --accent-2-soft: #272423; --accent-2-fg: #0d1117;
  --accent-3: #49e181; --accent-3-soft: #182627; --accent-3-fg: #0d1117;
  --accent-4: #bd7efc; --accent-4-soft: #222233; --accent-4-fg: #0d1117;
  --accent-5: #00d4f2; --accent-5-soft: #142730; --accent-5-fg: #0d1117;
  --accent-6: #f57272; --accent-6-soft: #292228; --accent-6-fg: #0d1117;
  --accent-7: #fbcd1a; --accent-7-soft: #232521; --accent-7-fg: #0d1117;
  --accent-8: #afb3bc; --accent-8-soft: #1f242c; --accent-8-fg: #0d1117;
  --chart-1: #5b8def; --chart-2: #fb923c; --chart-3: #4ade80; --chart-4: #c084fc;
  --chart-5: #22d3ee; --chart-6: #f87171; --chart-7: #facc15; --chart-8: #94a3b8;
  --chart-grid: #262d38; --chart-axis: #38414f; --chart-text: #8b95a3;
  --chart-baseline: #4b5563; --chart-today: #f87171; --chart-weekend: #212832;
}

[data-accent="1"] { --module-accent: var(--accent-1); --module-accent-soft: var(--accent-1-soft); --module-accent-fg: var(--accent-1-fg); }
[data-accent="2"] { --module-accent: var(--accent-2); --module-accent-soft: var(--accent-2-soft); --module-accent-fg: var(--accent-2-fg); }
[data-accent="3"] { --module-accent: var(--accent-3); --module-accent-soft: var(--accent-3-soft); --module-accent-fg: var(--accent-3-fg); }
[data-accent="4"] { --module-accent: var(--accent-4); --module-accent-soft: var(--accent-4-soft); --module-accent-fg: var(--accent-4-fg); }
[data-accent="5"] { --module-accent: var(--accent-5); --module-accent-soft: var(--accent-5-soft); --module-accent-fg: var(--accent-5-fg); }
[data-accent="6"] { --module-accent: var(--accent-6); --module-accent-soft: var(--accent-6-soft); --module-accent-fg: var(--accent-6-fg); }
[data-accent="7"] { --module-accent: var(--accent-7); --module-accent-soft: var(--accent-7-soft); --module-accent-fg: var(--accent-7-fg); }
[data-accent="8"] { --module-accent: var(--accent-8); --module-accent-soft: var(--accent-8-soft); --module-accent-fg: var(--accent-8-fg); }

/* ------------------------------------------------------------- dasar */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px; line-height: var(--lh-body);
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, dl, dd, figure { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.spacer { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* [BARU] primitif tata letak — pengganti 643 objek style inline.
   Setiap satuan mengambil dari skala jarak, jadi "gap 9px" tidak bisa
   lagi lahir di tengah sebuah view. */
.stack { display: flex; flex-direction: column; gap: var(--space-3); }
.stack.tight { gap: var(--space-2); }
.stack.loose { gap: var(--space-5); }
.row { display: flex; align-items: center; gap: var(--space-2); }
.row.top { align-items: flex-start; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.grid-auto { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-2 { display: grid; gap: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* [BARU] nada angka — menggantikan `color: v < 0 ? danger : success` inline */
.tone-pos { color: var(--success); }
.tone-neg { color: var(--danger); }
.tone-warn { color: var(--warning); }
/* [BARU] satu primitif untuk enam aturan "label kecil huruf besar" */
.eyebrow {
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase;
  color: var(--muted);
}
</script>
<script id="doc-css-2" type="text/plain">
/* ============================================================ CANGKANG */
.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: var(--header-h) minmax(0, 1fr);
  grid-template-areas: "brand header" "nav main";
  height: 100%;
}

/* Merek + konteks perusahaan. Slot konteks [BARU]: sebuah ERP menyebut
   badan hukum yang sedang dibuka; tanpa itu tangkapan layar dari dua
   lingkungan terlihat identik. */
.brand {
  grid-area: brand;
  display: flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-4);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface-sidebar);
  min-width: 0;
}
.brand-mark {
  width: 28px; height: 28px; flex: none; border-radius: var(--radius-sm);
  background: var(--primary); color: var(--primary-fg);
  display: grid; place-items: center; font-weight: var(--fw-bold); font-size: 13px;
  letter-spacing: -.02em;
}
.brand-text { min-width: 0; line-height: 1.2; }
.brand-text strong { display: block; font-size: 13.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text span { display: block; font-size: var(--fs-caption); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.header {
  grid-area: header;
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-5);
  border-bottom: 1px solid var(--border);
  background: var(--surface-header);
  min-width: 0;
}
/* Hamburger hanya ada di bawah 760 px; tanpa baris ini ia memakan 34 px
   di setiap lebar dan ikut mendorong userchip keluar layar pada 768. */
.btn.menu-toggle { display: none; }
.crumbs { display: flex; align-items: center; gap: 7px; font-size: var(--fs-body); color: var(--muted); min-width: 0; overflow: hidden; }
.crumbs > :not(:last-child)::after { content: "\203A"; color: var(--border-strong); margin-left: 7px; }
.crumbs b { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs a.crumb-module { flex: none; }
.crumbs a.crumb-screen { flex: 0 2 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs b { color: var(--text); font-weight: var(--fw-semi); }
.crumbs .sep { color: var(--border-strong); }
.crumbs a { color: inherit; }
.crumbs a.crumb-module {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--module-accent); font-weight: var(--fw-semi); white-space: nowrap;
}
.crumbs a.crumb-module::before {
  content: ""; width: 8px; height: 8px; border-radius: 2px; flex: none;
  background: var(--module-accent);
}
.crumbs a.crumb-screen { color: var(--text-2); }

/* [BARU] Medan pencarian perintah. Hari ini ini sebuah tombol hantu
   berlabel "Cari" — kotak inilah satu-satunya perubahan cangkang yang
   paling terlihat, dan ia memakai openSearch() yang sudah ada. */
.cmdk {
  display: flex; align-items: center; gap: var(--space-2);
  flex: 0 1 auto; width: min(420px, 38vw); min-width: 34px; height: 34px;
  padding: 0 var(--space-2) 0 var(--space-3);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--muted);
  font-size: var(--fs-body); cursor: pointer; text-align: left;
}
.cmdk:hover { background: var(--surface-3); border-color: var(--muted); color: var(--text-2); }
.cmdk:focus-visible { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
.cmdk .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk kbd {
  font: inherit; font-size: var(--fs-caption); font-weight: var(--fw-semi);
  padding: 2px 6px; border: 1px solid var(--border-strong); border-radius: 4px;
  background: var(--surface); color: var(--muted); white-space: nowrap;
}

.userchip {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 9px 4px 4px;
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  background: var(--surface); cursor: pointer;
}
.userchip:hover { background: var(--surface-hover); }
.avatar {
  width: 27px; height: 27px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--primary); color: var(--primary-fg);
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
}
.userchip .who { text-align: left; line-height: var(--lh-tight); }
.userchip .who b { display: block; font-size: 12.5px; font-weight: var(--fw-semi); }
.userchip .who span { display: block; font-size: var(--fs-caption); color: var(--muted); }

/* --------------------------------------------------------------- nav */
.nav {
  grid-area: nav;
  border-right: 1px solid var(--border);
  background: var(--surface-sidebar);
  overflow-y: auto;
  padding: var(--space-2) var(--space-2) var(--space-7);
}
.nav-group + .nav-group { margin-top: 2px; }
.nav-group > button {
  width: 100%;
  display: flex; align-items: center; gap: var(--space-2);
  padding: 7px var(--space-2);
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-2);
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase;
  cursor: pointer;
}
.nav-group > button:hover { background: var(--surface-hover); color: var(--text); }
/* [BARU] ikon modul di kepala grup — nama Lucide-nya sudah ada di
   MODULES sejak P1-C, tetapi sidebar tidak pernah memakainya. */
.nav-group > button .gi { width: 15px; height: 15px; flex: none; opacity: .7; }
.nav-group.has-active > button { color: var(--module-accent); box-shadow: inset 3px 0 0 var(--module-accent); }
.nav-group.has-active > button .gi { opacity: 1; }
.nav-group > button .chev { margin-left: auto; width: 13px; height: 13px; opacity: .55; transition: transform .16s; }
.nav-group[data-open="false"] > button .chev { transform: rotate(-90deg); }
.nav-group[data-open="false"] .nav-items { display: none; }
.nav-items { padding: 2px 0 var(--space-2); }
.nav-items a {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--nav-py) 10px var(--nav-py) 28px;
  border-radius: var(--radius-sm);
  color: var(--text-2); font-size: var(--fs-body);
}
.nav-items a:hover { background: var(--surface-hover); color: var(--text); text-decoration: none; }
.nav-items a.active { background: var(--surface-selected); color: var(--primary); font-weight: var(--fw-semi); }
.nav-items a .tick {
  width: 4px; height: 4px; border-radius: 50%; flex: none;
  background: currentColor; opacity: .3;
  margin-left: -14px; margin-right: 4px;
}
.nav-items a.active .tick { opacity: 1; }
.nav-divider {
  margin: var(--space-2) 0 2px; padding: 0 10px 0 28px;
  font-size: var(--fs-caption); font-weight: var(--fw-semi);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.nav-item { display: flex; align-items: center; gap: 2px; }
.nav-item > a { flex: 1; min-width: 0; }
.nav-item .star {
  flex: none; width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted); cursor: pointer; opacity: 0;
}
.nav-item:hover .star, .nav-item:focus-within .star, .nav-item .star.on { opacity: 1; }
.nav-item .star.on { color: var(--warning); }

.main {
  grid-area: main; overflow-y: auto; min-width: 0;
  padding: var(--space-5) var(--space-6) 60px;
  display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: var(--space-4);
}
.main > * { min-width: 0; }
</script>
<script id="doc-css-3" type="text/plain">
/* ================================================= KEPALA HALAMAN (§6)
   Satu bentuk untuk setiap layar sumber daya:
     remah  →  judul + subjudul  →  [aksi sekunder] [AKSI UTAMA]
   Zona sudah ada di detail.js hari ini; di sini ia menjadi standar. */
.page-head {
  display: flex; align-items: flex-start; gap: var(--space-4);
  flex-wrap: wrap;
}
.page-head h1 { font-size: var(--fs-page); line-height: var(--lh-tight); letter-spacing: -.015em; }
.page-head .desc { color: var(--muted); font-size: var(--fs-body); margin-top: var(--space-1); max-width: 68ch; }
.page-head .actions { margin-left: auto; display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.page-head .actions .zone { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.page-head .actions .zone + .zone { padding-left: var(--space-3); border-left: 1px solid var(--border); }
.page-title-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

/* ----------------------------------------------------------- tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 13px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-size: var(--fs-body); font-weight: var(--fw-medium);
  cursor: pointer; white-space: nowrap;
  transition: background .14s, border-color .14s, opacity .14s;
}
.btn:hover:not(:disabled) { background: var(--surface-hover); }
.btn:focus-visible { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); font-weight: var(--fw-semi); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn.success { color: var(--success); border-color: var(--success); background: transparent; }
.btn.success:hover:not(:disabled) { background: var(--success-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-hover); }
/* [BARU] tersier: aksi yang harus terbaca tetapi tidak boleh bersaing
   dengan tombol utama — dipakai di bilah alat daftar dan kaki kartu. */
.btn.subtle { border-color: transparent; background: var(--surface-3); color: var(--text-2); }
.btn.subtle:hover:not(:disabled) { background: var(--border); color: var(--text); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.sm svg { width: 13px; height: 13px; }

/* ----------------------------------------------------------- lencana */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: var(--fw-semi); white-space: nowrap;
  background: var(--neutral-soft); color: var(--neutral);
}
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.badge.green   { background: var(--success-soft); color: var(--success); }
.badge.red     { background: var(--danger-soft);  color: var(--danger); }
.badge.amber   { background: var(--warning-soft); color: var(--warning); }
.badge.blue    { background: var(--info-soft);    color: var(--info); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }
.badge.lg { padding: 4px 11px; font-size: var(--fs-body); }

/* ------------------------------------------------------------ kartu
   Tepi, bukan bayangan. Bayangan disimpan untuk lapisan yang benar-benar
   melayang (modal, popover, laci, toast) — di layar ERP yang penuh
   kartu, tiga belas bayangan kecil hanya membuat halaman kotor. */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.card-head {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border);
}
.card-head h2 { font-size: var(--fs-section); font-weight: var(--fw-semi); letter-spacing: -.005em; }
.card-head .sub { font-size: var(--fs-secondary); color: var(--muted); }
.card-body { padding: var(--space-4); }
.card-body.flush { padding: 0; }
.card-foot {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: 10px var(--space-4);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--radius) var(--radius);
}
.card-foot .btn.ghost { color: var(--primary); }

/* ------------------------------------------------- bilah alat daftar */
.toolbar {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: 10px var(--space-3);
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius) var(--radius) 0 0;
}
.search { position: relative; flex: 1 1 240px; min-width: 180px; max-width: 340px; }
.search input { width: 100%; padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; opacity: .45; pointer-events: none; }
.filter-w { width: auto; min-width: 138px; max-width: 200px; }

/* [BARU] Chip filter aktif. Hari ini keadaan filter hanya terlihat di
   dalam kontrolnya sendiri; begitu bilah alat menggulir keluar layar,
   tidak ada yang mengatakan mengapa daftarnya pendek. */
.chips {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--fs-secondary);
}
.chips .lbl { color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 4px 3px 9px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
  background: var(--surface-2); color: var(--text-2);
  font-size: var(--fs-secondary); white-space: nowrap;
}
.chip b { font-weight: var(--fw-semi); color: var(--text); }
.chip button {
  width: 18px; height: 18px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
}
.chip button:hover { background: var(--border); color: var(--text); }
.chips .clear { margin-left: auto; }
.chips .clear button {
  border: 0; background: transparent; color: var(--primary);
  font: inherit; font-size: var(--fs-secondary); cursor: pointer; padding: 3px 6px; border-radius: var(--radius-sm);
}
.chips .clear button:hover { background: var(--primary-soft); }

/* [BARU] Bilah seleksi — muncul hanya bila ada baris tercentang. */
.selbar {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--primary);
  background: var(--primary-soft); color: var(--primary);
  font-size: var(--fs-body); font-weight: var(--fw-semi);
}
.selbar .btn { background: var(--surface); }
</script>
<script id="doc-css-4" type="text/plain">
/* ------------------------------------------------------------ tabel */
.table-wrap { overflow: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-table); }
table.data th {
  position: sticky; top: 0; z-index: 1;
  padding: var(--cell-py) var(--cell-px);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-strong);
  text-align: left; white-space: nowrap;
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
table.data td {
  padding: var(--cell-py) var(--cell-px);
  height: var(--row-h);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr.clickable { cursor: pointer; }
table.data tbody tr.clickable:hover { background: var(--surface-2); }
/* [BARU] keadaan terpilih, dan ia harus menang atas hover */
table.data tbody tr.selected td,
table.data tbody tr.selected:hover td { background: var(--surface-selected); }
table.data tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
table.data th.right, table.data td.right { text-align: right; }
table.data th.center, table.data td.center { text-align: center; }
/* [BARU] angka rata kanan SELALU tabular — hari ini hanya .num, dan
   pemanggil harus ingat memakai dua kelas sekaligus. */
table.data td.right, table.data td.num, table.data tfoot td { font-variant-numeric: tabular-nums; }
table.data td.code { font-family: var(--mono); font-size: var(--fs-secondary); white-space: nowrap; }
table.data td.strong { font-weight: var(--fw-semi); }
table.data th.pick-opt, table.data td.pick-opt { width: 1%; padding-right: 0; }
table.data tfoot td {
  padding: var(--foot-py) var(--cell-px);
  border-top: 2px solid var(--border-strong);
  font-weight: var(--fw-bold);
  background: var(--surface-2);
}
table.data tr.section-row td { background: var(--surface-3); font-weight: var(--fw-semi); }
table.data tr.total-row td { font-weight: var(--fw-bold); background: var(--surface-2); }
.cell-main { display: block; font-weight: var(--fw-medium); }
/* [BARU] pemotongan cerdas: kolom teks panjang tidak mendorong kolom uang */
.cell-main.truncate { max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-sub { display: block; font-size: 11.5px; color: var(--muted); }
.pager {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: 10px var(--space-3);
  border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--muted);
}
table.lines { width: 100%; border-collapse: collapse; font-size: var(--fs-table); }
table.lines th {
  padding: 6px var(--space-2); text-align: left;
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
table.lines td { padding: 4px var(--space-1); vertical-align: top; border-bottom: 1px solid var(--border); }
table.lines td:first-child { padding-left: 0; }
table.lines .row-total { padding: 8px; font-variant-numeric: tabular-nums; font-weight: var(--fw-semi); white-space: nowrap; }
.lines-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.lines-head h3 { font-size: var(--fs-secondary); font-weight: var(--fw-bold); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.lines-total { display: flex; justify-content: flex-end; gap: var(--space-4); padding-top: var(--space-3); font-size: var(--fs-body); }
.lines-total b { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ medan */
.input, input[type=text], input[type=search], input[type=number], input[type=date], select, textarea {
  width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-family: inherit; font-size: var(--fs-body);
}
textarea { height: auto; min-height: 74px; padding: 8px 10px; line-height: 1.55; resize: vertical; }
select { appearance: none; padding-right: 28px; background-image: var(--chevron); background-repeat: no-repeat; background-position: right 9px center; }
/* [BARU] panah <select> mengikuti tema. Hari ini ia sebuah data-URI
   dengan stroke='%236b7684' yang dipanggang — abu-abu terang, juga di
   tema gelap, dan nilainya nilai --muted yang sudah ditarik 2 Sep. */
:root { --chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 16 16' fill='none' stroke='%235e6874' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>"); }
:root[data-theme="dark"] { --chevron: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 16 16' fill='none' stroke='%238b95a3' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>"); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
.field { display: block; }
.field > label, .field > .lbl { display: block; font-size: var(--fs-label); font-weight: var(--fw-semi); color: var(--text-2); margin-bottom: 5px; }
.field .req { color: var(--danger); }
.field .help { font-size: 11.5px; color: var(--muted); margin-top: var(--space-1); }
.field .err { font-size: 11.5px; color: var(--danger); margin-top: var(--space-1); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); }
/* [BARU] lebar yang masuk akal: tanggal, jumlah dan kode tidak lagi
   direntangkan 100% hanya karena ia tinggal di kisi dua kolom. */
.field.w-sm input, .field.w-sm select { max-width: 200px; }
.field.w-md input, .field.w-md select { max-width: 320px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--form-gap); }
.form-grid .span2 { grid-column: 1 / -1; }
.form-section + .form-section { margin-top: var(--space-5); padding-top: var(--space-5); border-top: 1px solid var(--border); }
.form-section > h3 {
  font-size: var(--fs-secondary); font-weight: var(--fw-bold);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  margin-bottom: var(--space-3);
}
.input-affix { position: relative; }
.input-affix .prefix { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: var(--fs-body); color: var(--muted); pointer-events: none; }
.input-affix.prefix-rp input { padding-left: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.check-row { display: flex; align-items: center; gap: var(--space-2); height: 34px; font-size: var(--fs-body); }
.check-row label { margin: 0; font-weight: 400; color: var(--text); font-size: var(--fs-body); }

/* --------------------------------------------------- statistik / KPI */
.stat-row { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stat {
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface);
}
.stat .label { font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.stat .value { display: block; font-size: var(--fs-kpi); font-weight: 650; letter-spacing: -.02em; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .value.sm { font-size: var(--fs-page); }
.stat .delta { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
.stat .delta.up { color: var(--success); }
.stat .delta.down { color: var(--danger); }
.stat .delta svg { width: 12px; height: 12px; }
.stat.unknown .value { color: var(--muted); }

/* ------------------------------------------------- alert / kekosongan */
.alert {
  display: flex; align-items: flex-start; gap: var(--space-2);
  padding: 10px var(--space-3);
  border: 1px solid transparent; border-left: 3px solid var(--muted);
  border-radius: var(--radius-sm);
  background: var(--neutral-soft);
  font-size: var(--fs-body);
}
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.alert.info  { background: var(--info-soft);    border-left-color: var(--info);    color: var(--info); }
.alert.warn  { background: var(--warning-soft); border-left-color: var(--warning); color: var(--warning); }
.alert.error { background: var(--danger-soft);  border-left-color: var(--danger);  color: var(--danger); }
.alert .body { color: var(--text); min-width: 0; }
.alert .body .cell-sub { color: var(--muted); }
.empty { padding: var(--space-7) var(--space-4); text-align: center; }
.empty svg.illus { width: 112px; height: 112px; }
.empty h3 { font-size: var(--fs-section); margin-top: var(--space-3); }
.empty p { font-size: var(--fs-body); color: var(--muted); margin-top: var(--space-1); }
.empty .btn { margin-top: var(--space-3); }
.empty.compact { padding: var(--space-5) var(--space-3); }
.empty.compact svg.illus { width: 72px; height: 72px; }
.illus .ln { stroke: var(--border-strong); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.illus .ac { stroke: var(--primary); stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.illus .fl { fill: var(--surface-3); }
.illus .fa { fill: var(--primary-soft); }
.illus[data-kind="error"] .ac { stroke: var(--danger); }
.illus[data-kind="error"] .fa { fill: var(--danger-soft); }
.illus[data-kind="done"] .ac { stroke: var(--success); }
.illus[data-kind="done"] .fa { fill: var(--success-soft); }
.skeleton {
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
</script>
<script id="doc-css-5" type="text/plain">
/* ------------------------------------------------- dokumen / detail */
/* Kepala dokumen: kode, status, lawan transaksi, dan NILAI — satu blok,
   supaya keputusan ratusan juta tidak duduk sebaris dengan "Cetak". */
.doc-head {
  display: flex; align-items: flex-start; gap: var(--space-5); flex-wrap: wrap;
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface);
  margin-bottom: var(--space-4);
}
.doc-id { min-width: 0; }
.doc-id .code { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.doc-id .code h1 { font-size: var(--fs-page); font-family: var(--mono); letter-spacing: -.01em; }
.doc-id .party { margin-top: 6px; font-size: var(--fs-body); font-weight: var(--fw-semi); }
.doc-id .where { font-size: var(--fs-secondary); color: var(--muted); }
.doc-amount { margin-left: auto; text-align: right; }
.doc-amount .label { font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.doc-amount .value { display: block; font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; }
.doc-amount .sub { font-size: var(--fs-secondary); color: var(--muted); }
.doc-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; flex-basis: 100%; padding-top: var(--space-3); border-top: 1px solid var(--border); }
.doc-actions .zone { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.doc-actions .zone + .zone { padding-left: var(--space-3); border-left: 1px solid var(--border); }
.doc-actions .zone.keputusan { margin-left: auto; padding-left: var(--space-3); border-left: 1px solid var(--border); }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-4); align-items: start; }
.kv { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: var(--kv-gap); }
.kv dt { font-size: var(--fs-secondary); color: var(--muted); }
.kv dd { margin: 0; font-size: var(--fs-body); word-break: break-word; }
.kv dd.num { font-variant-numeric: tabular-nums; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 7px var(--space-5); font-size: var(--fs-body); }
.totals dt { color: var(--muted); }
.totals dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.totals .grand { padding-top: 9px; border-top: 2px solid var(--border-strong); font-weight: var(--fw-bold); font-size: var(--fs-section); }
.totals .grand dd { font-size: var(--fs-section); }

.timeline { display: flex; flex-direction: column; gap: var(--space-3); }
.timeline-item { position: relative; padding-left: var(--space-5); border-left: 2px solid var(--border); padding-bottom: 2px; }
.timeline-item::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
.timeline-item.ok::before { border-color: var(--success); background: var(--success); }
.timeline-item.bad::before { border-color: var(--danger); background: var(--danger); }
.timeline-item.pending::before { border-color: var(--warning); }
.timeline-item .who { font-size: var(--fs-body); font-weight: var(--fw-semi); }
.timeline-item .meta { font-size: 11.5px; color: var(--muted); }
.timeline-item .note { font-size: var(--fs-secondary); color: var(--text-2); margin-top: 3px; }

.progress { height: 6px; border-radius: var(--radius-pill); background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
.progress.green > span { background: var(--success); }
.progress.amber > span { background: var(--warning); }
.progress.red > span { background: var(--danger); }

.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); margin-bottom: var(--space-4); }
.tabs button {
  border: 0; background: transparent; cursor: pointer;
  padding: 9px var(--space-3); margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  font: inherit; font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--muted);
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: var(--fw-semi); }

/* ------------------------------------------- beranda modul / launcher */
.module-head {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--border); border-left: 4px solid var(--module-accent);
  border-radius: var(--radius); background: var(--surface);
  margin-bottom: var(--space-4);
}
.module-icon {
  width: 44px; height: 44px; flex: none; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--module-accent-soft); color: var(--module-accent);
}
.module-icon svg { width: 22px; height: 22px; }
.module-head h1 { font-size: var(--fs-page); letter-spacing: -.015em; }
.module-head .desc { font-size: var(--fs-body); color: var(--muted); margin-top: 2px; max-width: 72ch; }
.module-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.module-card {
  display: block; padding: var(--space-3); height: 100%;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
}
.module-card:hover { border-color: var(--border-strong); background: var(--surface-2); text-decoration: none; }
.module-card b { display: block; font-size: var(--fs-body); font-weight: var(--fw-semi); }
.module-card span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.module-cell { display: flex; align-items: flex-start; gap: var(--space-1); }
.module-cell .module-card { flex: 1; min-width: 0; }
.module-section { font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); margin: var(--space-5) 0 var(--space-2); }
.home-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.home-tile {
  display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-left: 4px solid var(--module-accent);
  border-radius: var(--radius); background: var(--surface); color: var(--text);
}
.home-tile:hover { background: var(--surface-2); text-decoration: none; }
.home-tile-icon { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--module-accent-soft); color: var(--module-accent); }
.home-tile-icon svg { width: 19px; height: 19px; }
.home-tile b { display: block; font-size: var(--fs-body); font-weight: var(--fw-semi); }
.home-tile .screens { font-size: 11.5px; color: var(--muted); }
.home-kpi-value { display: block; font-size: var(--fs-page); font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 6px; }
.home-kpi-label { font-size: 11px; color: var(--muted); }
.home-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.home-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border: 1px solid var(--border); border-radius: var(--radius-pill);
  background: var(--surface); color: var(--text-2); font-size: 12.5px;
}
.home-chip:hover { background: var(--surface-2); border-color: var(--border-strong); text-decoration: none; }

/* --------------------------------------------------------- dasbor */
.dash-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card.widget { display: flex; flex-direction: column; }
.card.widget > .widget-body { flex: 1; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 1fr) minmax(70px, 2fr) auto; align-items: center; gap: var(--space-3); padding: 5px 0; }
.bar-row .name { font-size: var(--fs-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .amt { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--chart-text); font-family: var(--font); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* ---------------------------------------------------------- modal */
/* grid-template-columns: minmax(0, 1fr) WAJIB. Tanpa itu treknya
   disesuaikan ke sumbangan max-content .modal.wide (960 px), lalu
   max-width:100% mengukur 100% dari 960 px — dialog lebar menembus
   layar 390 px tanpa satu pun aturan terlihat salah. */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(12,17,23,.5); display: grid;
  grid-template-columns: minmax(0, 1fr); place-items: center; padding: var(--space-4); }
.modal {
  width: 640px; max-width: 100%; max-height: 88%;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.modal.wide { width: 960px; }
.modal.narrow { width: 420px; }
.modal-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: var(--fs-section); font-weight: var(--fw-semi); }
.modal-head .sub { font-size: var(--fs-secondary); color: var(--muted); }
.modal-body { padding: var(--space-5); overflow-y: auto; }
/* Kaki lengket: formulir ERP panjang, dan tombol Simpan tidak boleh
   hanya bisa dicapai dengan menggulir ke dasar 40 baris. */
.modal-foot {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}

/* ----------------------------------------------------- responsif */
@media (max-width: 1180px) {
  .dash-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card.widget[data-size="lebar"] { grid-column: span 2; }
  .detail-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .userchip .who { display: none; }
  .userchip { padding: 3px; border-color: transparent; }
  .doc-amount { margin-left: 0; text-align: left; flex-basis: 100%; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "header" "main"; }
  .brand { display: none; }
  .nav {
    position: fixed; inset: var(--header-h) auto 0 0; z-index: 50;
    width: var(--drawer-w); transform: translateX(-100%);
    transition: transform .18s ease-out; box-shadow: var(--shadow-lg);
  }
  body.nav-open .nav { transform: none; }
  body.nav-open::after { content: ""; position: fixed; inset: var(--header-h) 0 0 0; z-index: 40; background: rgba(12,17,23,.45); }
  .btn.menu-toggle { display: inline-flex; }
  .main { padding: var(--space-4) var(--space-3) 50px; }
  .header { padding: 0 var(--space-3); gap: var(--space-2); }
  /* Di 390 px medan perintah menyusut jadi ikon — namanya tetap ada
     untuk pembaca layar, dan remah roti tetap punya ruang. */
  .crumbs a.crumb-screen { display: none; }
  .header .theme-toggle { display: none; }
  .cmdk { width: 34px; padding: 0; justify-content: center; }
  .cmdk .ph, .cmdk kbd { display: none; }
  .userchip .who { display: none; }
  .userchip { padding: 3px; border-color: transparent; }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .card.widget[data-size="lebar"] { grid-column: auto; }
  .stat-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .page-head .actions { margin-left: 0; width: 100%; }
  .page-head .actions .zone + .zone { padding-left: 0; border-left: 0; }
  .doc-actions .zone.keputusan { margin-left: 0; padding-left: 0; border-left: 0; width: 100%; }
  .doc-actions .zone.keputusan .btn { flex: 1; }
  .hide-narrow { display: none; }
  .modal { border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-height: 92%; }
  .overlay { align-items: end; padding: 0; }
}
@media (pointer: coarse) {
  .btn.sm { height: 36px; }
  .btn.sm.icon { width: 36px; }
  .nav-items a { min-height: 36px; }
  .nav-item .star { opacity: .45; width: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media print {
  .nav, .brand, .header, .page-head .actions, .doc-actions, .toolbar, .chips, .selbar, .pager, .tabs { display: none !important; }
  .shell { display: block; }
  .main { padding: 0; overflow: visible; }
  .detail-grid { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}
</script>

<div class="shell">

  <div class="brand">
    <div class="brand-mark">N</div>
    <div class="brand-text">
      <strong>Nusantara ERP</strong>
      <span>PT Nusantara Karya Presisi</span>
    </div>
  </div>
