<script id="doc-css-6" type="text/plain">
/* Rentang ubin dasbor. Di aplikasi nyata angka ini ditulis sebagai
   style inline `gridColumn` oleh dashboard.js dan harness membacanya
   lewat getComputedStyle().gridColumnEnd — kontrak itu dipertahankan;
   di prototipe ia kelas, supaya bisa dibaca. */
.dash-grid .card.widget[data-size="kecil"]  { grid-column: span 1; }
.dash-grid .card.widget[data-size="sedang"] { grid-column: span 2; }
.dash-grid .card.widget[data-size="lebar"]  { grid-column: span 4; }
@media (max-width: 1180px) {
  .dash-grid .card.widget[data-size="lebar"]  { grid-column: span 2; }
  .dash-grid .card.widget[data-size="sedang"] { grid-column: span 2; }
}
@media (max-width: 760px) {
  .dash-grid .card.widget[data-size="kecil"],
  .dash-grid .card.widget[data-size="sedang"],
  .dash-grid .card.widget[data-size="lebar"] { grid-column: span 1; }
}
</script>
<script id="doc-css-7" type="text/plain">
/* ====================================== FORMULIR HALAMAN PENUH (UI-4)
   Dokumen ERP diedit sebagai HALAMAN, bukan di dalam overlay 960 px.
   Sebabnya terukur (ASESMEN-UX §1.2): pada viewport 900 px tabel baris
   PO mulai di y = 843 px — di bawah lipatan, dengan tiga textarea lebar
   penuh menumpuk di atasnya. Satu dokumen dengan 40 baris BOQ diedit di
   jendela yang menggulung DI DALAM jendela yang menggulung.
   Yang berubah: baris item mendapat lebar halaman, tombol Simpan tidak
   pernah perlu dicari, uangnya terlihat sambil mengetik, dan URL-nya
   bisa dibagikan. Dialog tetap dipakai untuk prompt aksi (promptFields)
   dan konfirmasi — itu bukan formulir dokumen. */
:root { --form-bar-h: 58px; }

.form-page { display: grid; gap: var(--space-4); }

/* Bilah lengket: judul + Batal/Simpan. Ia menembus padding .main supaya
   garis bawahnya selebar halaman, bukan selebar kolom isi. */
.form-topbar {
  position: sticky; top: calc(var(--space-5) * -1); z-index: 5;
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
  min-height: var(--form-bar-h);
  margin: calc(var(--space-5) * -1) calc(var(--space-6) * -1) var(--space-4);
  padding: var(--space-2) var(--space-6);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.form-topbar h1 { font-size: var(--fs-section); font-weight: var(--fw-semi); letter-spacing: -.005em; }
.form-topbar .sub { font-size: var(--fs-secondary); color: var(--muted); }
.form-topbar .acts { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
.form-topbar .saved { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-secondary); color: var(--muted); }
.form-topbar .saved svg { width: 13px; height: 13px; }

.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-5); align-items: start; }
.form-main { min-width: 0; display: grid; gap: var(--space-4); }
.form-main > *, .form-rail > *, .stack > * { min-width: 0; }
.form-rail { position: sticky; top: calc(var(--form-bar-h) + var(--space-4)); display: grid; gap: var(--space-3); }

/* Kisi isian dibatasi lebarnya; hanya tabel baris yang boleh selebar
   halaman. Formulir 1.100 px penuh medan teks tidak terbaca — matanya
   kehilangan pasangan label/kontrol di seberang. */
.form-fields { max-width: 860px; }
/* Blok kepala dokumen memakai lebar halaman dalam TIGA kolom, dengan
   subjudulnya hidup di dalam kisi yang sama. Menumpuk satu kartu per
   seksi terukur lebih buruk daripada modal yang digantikannya: baris
   item mulai di y = 887 px (modal 843), karena setiap kartu membayar
   kepala + padding sendiri sementara 800 px lebar dibiarkan kosong. */
.form-fields-wide { max-width: none; }
/* Pembungkus baris item BUKAN wadah gulir di lebar penuh, supaya kepala
   kolom lengketnya mengukur terhadap .main. Urutan penting: deklarasi
   ini harus berdiri SEBELUM @media di bawah — ditulis sesudahnya, ia
   menang di semua lebar dan tabel baris menembus layar 390 px. */
.lines-wrap { overflow: visible; }
.form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.cols-3 .span-2 { grid-column: span 2; }
.form-subhead {
  grid-column: 1 / -1;
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted);
}
.form-subhead + * { margin-top: 0; }
.form-grid .form-subhead:not(:first-child) { margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border); }
@media (max-width: 900px) {
  .form-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lines-wrap { overflow-x: auto; }
  .lines-wrap table.lines thead th { position: static; }
}
@media (max-width: 760px)  { .form-grid.cols-3 { grid-template-columns: minmax(0, 1fr); }
                             .form-grid.cols-3 .span-2 { grid-column: auto; } }

/* Baris item: entri seperti lembar kerja, bukan tumpukan kartu. */
table.lines thead th {
  position: sticky; top: calc(var(--form-bar-h) - var(--space-5)); z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-strong);
}
table.lines td.rownum {
  width: 1%; padding-left: var(--space-2); padding-right: var(--space-2);
  color: var(--muted); font-size: var(--fs-secondary);
  font-variant-numeric: tabular-nums; text-align: right; vertical-align: middle;
}
table.lines tbody tr:hover td.rownum { color: var(--text-2); }
table.lines input, table.lines select { height: 31px; font-size: 12.5px; }
table.lines td.right .input-affix input { text-align: right; }
table.lines tr.add-row td { padding: 0; border-bottom: 0; }
.add-row button {
  width: 100%; display: flex; align-items: center; gap: 6px;
  padding: 9px var(--space-2);
  border: 0; border-radius: 0;
  background: transparent; color: var(--primary);
  font: inherit; font-size: var(--fs-body); font-weight: var(--fw-medium); cursor: pointer;
}
.add-row button:hover { background: var(--primary-soft); }
.add-row button svg { width: 14px; height: 14px; }
.lines-hint { font-size: 11.5px; color: var(--muted); padding: var(--space-2) 0 0; }

/* Ringkasan uang di rel — terlihat sementara baris diketik. */
.rail-money { display: grid; grid-template-columns: 1fr auto; gap: 7px var(--space-3); font-size: var(--fs-body); }
.rail-money dt { color: var(--muted); }
.rail-money dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.rail-money .grand { padding-top: 9px; border-top: 2px solid var(--border-strong); font-weight: var(--fw-bold); }
.rail-money .grand dd { font-size: var(--fs-section); }

/* Daftar lompat bagian. */
.form-jump { display: grid; gap: 1px; }
.form-jump a {
  display: block; padding: 6px var(--space-2);
  border-radius: var(--radius-sm); border-left: 2px solid transparent;
  color: var(--text-2); font-size: var(--fs-secondary);
}
.form-jump a:hover { background: var(--surface-hover); color: var(--text); text-decoration: none; }
.form-jump a.current { border-left-color: var(--primary); background: var(--surface-selected); color: var(--primary); font-weight: var(--fw-semi); }
.form-jump a .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.form-jump a.current .n { color: inherit; }

/* Ringkasan galat: satu tempat untuk "apa yang masih salah". */
.card.needs-fix { border-color: var(--danger); }
.card.needs-fix .card-head { background: var(--danger-soft); border-bottom-color: var(--danger); }
.card.needs-fix .card-head h2 { color: var(--danger); }
.fix-list { display: grid; gap: var(--space-1); }
.fix-list a { font-size: var(--fs-secondary); color: var(--danger); }

@media (max-width: 1180px) {
  .form-layout { grid-template-columns: minmax(0, 1fr); }
  /* Rel turun ke bawah isi, dan berhenti lengket: pada satu kolom ia
     akan menutupi isian yang sedang diketik. */
  .form-rail { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .form-fields { max-width: none; }
}
@media (max-width: 760px) {
  .form-topbar {
    top: calc(var(--space-4) * -1);
    margin: calc(var(--space-4) * -1) calc(var(--space-3) * -1) var(--space-3);
    padding: var(--space-2) var(--space-3);
  }
  .form-topbar .acts { width: 100%; margin-left: 0; }
  .form-topbar .acts .btn { flex: 1; }
  .form-topbar .saved { order: -1; }
  .form-rail { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  .form-topbar, .form-rail, .add-row, .form-jump { display: none !important; }
  .form-layout { display: block; }
}
</script>
<script id="doc-css-8" type="text/plain">
/* ============================== LAPORAN KEUANGAN & WORKSPACE PROYEK
   Dua domain dengan tuntutan berbeda. Laporan keuangan harus terbaca
   seperti perangkat lunak akuntansi: angka tabular, hierarki akun,
   subtotal yang berbunyi, dan KEPALA LAPORAN yang menyatakan dasarnya
   (periode, basis, mata uang, kapan dihitung) — laporan tanpa kepala
   tidak bisa dilampirkan ke mana pun. Workspace proyek harus menjawab
   lima pertanyaan manajer proyek dalam hitungan detik; yang paling
   mahal di antaranya adalah "apa yang memblokir penagihan". */

/* ---------------------------------------------------- kepala laporan */
.report-head {
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface);
}
.report-title { font-size: var(--fs-page); letter-spacing: -.015em; }
.report-entity { font-size: var(--fs-body); font-weight: var(--fw-semi); color: var(--text-2); margin-top: 2px; }
.report-meta {
  display: grid; gap: var(--space-3) var(--space-5);
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  margin-top: var(--space-4); padding-top: var(--space-3);
  border-top: 1px solid var(--border);
}
.report-meta dt { font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.report-meta dd { margin: 2px 0 0; font-size: var(--fs-body); font-variant-numeric: tabular-nums; }

/* Bilah proporsi ember. Lebarnya DATA, jadi ia satu-satunya tempat
   `style` inline masih benar — geometri yang datang dari angka, bukan
   dari keputusan rancangan. */
.bucket-bar { display: flex; height: 10px; border-radius: var(--radius-pill); overflow: hidden; background: var(--surface-3); }
.bucket-bar span { display: block; height: 100%; }
.bucket-legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-3); }
.bucket-legend > div { display: grid; gap: 1px; }
.bucket-legend .k { display: flex; align-items: center; gap: 6px; font-size: var(--fs-secondary); color: var(--muted); }
.bucket-legend .k i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.bucket-legend .v { font-size: var(--fs-body); font-weight: var(--fw-semi); font-variant-numeric: tabular-nums; }

/* ------------------------------------------- tabel laporan keuangan */
/* Angka akuntansi: tabular, rata kanan, negatif dalam kurung. Warna
   dipakai HANYA pada selisih yang benar-benar merugikan — kalau setiap
   angka merah, tidak ada yang merah. */
table.data.statement td.amt, table.data.statement th.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data.statement th.amt { text-align: right; }
table.data.statement td.acc { white-space: nowrap; }
table.data.statement .lvl-2 { padding-left: var(--space-4); }
table.data.statement .lvl-3 { padding-left: var(--space-6); }
table.data.statement tr.head-row td {
  background: var(--surface-3); font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-2);
}
table.data.statement tr.subtotal-row td { border-top: 1px solid var(--border-strong); font-weight: var(--fw-semi); }
table.data.statement tr.grand-row td {
  border-top: 2px solid var(--border-strong);
  border-bottom: 3px double var(--border-strong);
  font-weight: var(--fw-bold); background: var(--surface-2);
}
table.data.statement tr.margin-row td { font-size: var(--fs-secondary); color: var(--muted); border-bottom: 0; padding-top: 0; }
table.data.statement tr.spacer-row td { height: 10px; padding: 0; border-bottom: 0; }
.amt.neg { color: var(--danger); }
.amt.zero { color: var(--muted); }

/* Bilah umur mini di dalam sel. */
.mini-aging { display: flex; height: 6px; width: 92px; border-radius: var(--radius-pill); overflow: hidden; background: var(--surface-3); }
.mini-aging span { display: block; height: 100%; }

/* Pernyataan rekonsiliasi: buku pembantu vs akun kontrol GL. */
.tie-out { display: grid; grid-template-columns: 1fr auto; gap: 6px var(--space-4); font-size: var(--fs-body); }
.tie-out dt { color: var(--muted); }
.tie-out dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.tie-out .diff { padding-top: 8px; border-top: 1px solid var(--border-strong); font-weight: var(--fw-semi); }

/* ------------------------------------------------- workspace proyek */
/* Daftar penghambat: satu baris = satu hal yang benar-benar menahan
   uang, dengan pemiliknya dan umurnya. Ia bukan alert; alert dibaca
   sekali lalu diabaikan, daftar dikerjakan. */
.blockers { display: grid; }
.blocker {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border);
}
.blocker:last-child { border-bottom: 0; }
.blocker:hover { background: var(--surface-2); }
.blocker .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.blocker .mark svg { width: 15px; height: 15px; }
.blocker .mark.stop { background: var(--danger-soft); color: var(--danger); }
.blocker .mark.wait { background: var(--warning-soft); color: var(--warning); }
.blocker .what { font-size: var(--fs-body); font-weight: var(--fw-medium); }
.blocker .who { font-size: 11.5px; color: var(--muted); }
.blocker .act { display: flex; align-items: center; gap: var(--space-2); }

/* Ubin vonis: angka + putusannya, bukan angka saja. */
.verdict { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.verdict .stat .judge { display: inline-flex; align-items: flex-start; gap: 4px; margin-top: 6px; font-size: 11.5px; font-weight: var(--fw-semi); line-height: 1.35; }
.verdict .stat .judge svg { width: 12px; height: 12px; flex: none; margin-top: 2px; }
.verdict .stat .scale { margin-top: 7px; }

/* Tabel WBS: batang progres di dalam sel, selisih sebagai kolomnya sendiri. */
td .wbs-bar { display: flex; align-items: center; gap: var(--space-2); }
td .wbs-bar .progress { flex: 1; min-width: 56px; }
td .wbs-bar .pct { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 34px; text-align: right; }

/* Termin: satu baris per termin, keadaan sebagai bentuk dan kata. */
.termin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
.termin:last-child { border-bottom: 0; }
.termin .t { font-size: var(--fs-body); }
.termin .s { font-size: 11.5px; color: var(--muted); }
.termin .v { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-body); font-weight: var(--fw-semi); }

@media (max-width: 900px) {
  .blocker { grid-template-columns: auto minmax(0, 1fr); }
  .blocker .act { grid-column: 2; }
}
</script>
<script id="doc-css-9" type="text/plain">
/* ================================ NAVIGASI, PAPAN, LAPANGAN, KEADAAN
   Empat area yang bukti tertulisnya paling kuat dan belum tersentuh:
   sidebar 121 tautan (ASESMEN-UX §2.1), papan kanban yang mengaku
   sendiri tidak punya jalan keyboard (board.js:73-82), layar lapangan
   yang dirancang dari batasan fisik, dan keadaan sistem — termasuk
   satu-satunya layar aplikasi yang TIDAK punya aturan CSS sama sekali
   (`.boot-failed`, dipasang index.html:55, nol kecocokan di app.css). */

/* ------------------------------------------- perbandingan rancangan */
.compare { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.compare > section { min-width: 0; }
.compare .card-head .tag {
  font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps);
  text-transform: uppercase; padding: 2px 8px; border-radius: var(--radius-pill);
}
.compare .tag.now { background: var(--neutral-soft); color: var(--neutral); }
.compare .tag.next { background: var(--primary-soft); color: var(--primary); }

/* Sidebar mini untuk demonstrasi di dalam halaman. */
.navdemo { background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--space-2); }
.navdemo .grp {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 7px var(--space-2); border-radius: var(--radius-sm);
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-2);
}
.navdemo .grp .gi { width: 15px; height: 15px; flex: none; opacity: .7; }
.navdemo .grp .n { margin-left: auto; font-size: var(--fs-caption); color: var(--muted); font-variant-numeric: tabular-nums; }
.navdemo a {
  display: block; padding: 5px 10px 5px 28px;
  border-radius: var(--radius-sm); color: var(--text-2); font-size: 12.5px;
}
.navdemo a:hover { background: var(--surface-hover); color: var(--text); text-decoration: none; }
.navdemo .sec {
  margin: var(--space-2) 0 2px; padding: 0 10px 0 28px;
  font-size: var(--fs-caption); font-weight: var(--fw-semi);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.navdemo .navfilter { position: relative; margin-bottom: var(--space-2); }
.navdemo .navfilter input { height: 30px; font-size: 12.5px; padding-left: 28px; }
.navdemo .navfilter svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; opacity: .45; pointer-events: none; }
.navdemo .more { padding: 6px 10px 2px 28px; font-size: 11.5px; color: var(--muted); }

/* ------------------------------------------------- palet perintah */
.palette { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow-md); }
.palette-field { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.palette-field svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
.palette-field input { border: 0; height: auto; padding: 0; font-size: 15px; background: transparent; }
.palette-field input:focus { box-shadow: none; }
.palette-group { padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
.palette-group:last-of-type { border-bottom: 0; }
.palette-group > b {
  display: block; padding: 2px var(--space-4) var(--space-1);
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted);
}
.palette-hit {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 7px var(--space-4); font: inherit; font-size: var(--fs-body); color: var(--text);
}
.palette-hit:hover { background: var(--surface-hover); }
.palette-hit.active { background: var(--surface-selected); color: var(--primary); }
.palette-hit .ic { width: 16px; height: 16px; flex: none; opacity: .7; }
.palette-hit .where { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.palette-hit mark { background: var(--warning-soft); color: inherit; font-weight: var(--fw-semi); border-radius: 2px; }
.palette-foot { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: var(--surface-2); font-size: 11.5px; color: var(--muted); }
.palette-foot kbd { font: inherit; font-size: 10.5px; font-weight: var(--fw-semi); padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); }

/* ------------------------------------------------------ papan kanban */
.board-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(215px, 1fr); gap: var(--space-3); overflow-x: auto; padding-bottom: var(--space-2); }
.board-lane { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
.board-lane-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
.board-lane-head .cell-main { font-size: var(--fs-secondary); font-weight: var(--fw-semi); }
.board-count { margin-left: auto; font-size: var(--fs-caption); font-weight: var(--fw-bold); color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface-3); padding: 1px 7px; border-radius: var(--radius-pill); }
.board-cards { display: grid; gap: var(--space-2); padding: var(--space-2); min-height: 60px; }
.board-card { border: 1px solid var(--border); border-left: 3px solid var(--module-accent, var(--border-strong)); border-radius: var(--radius-sm); background: var(--surface); padding: var(--space-2) 10px; cursor: grab; }
.board-card:hover { border-color: var(--border-strong); }
.board-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.board-card.picked { border-color: var(--primary); box-shadow: var(--focus-ring); cursor: default; }
.board-card-head { display: flex; align-items: baseline; gap: var(--space-2); }
.board-card-head .mono { font-size: 12px; font-weight: var(--fw-semi); }
.board-card-head .num { margin-left: auto; font-size: 12px; }
.board-card-foot { display: flex; align-items: center; gap: var(--space-2); margin-top: 5px; }
/* [BARU] Jalan keyboard. Papan hari ini mengakui sendiri tidak punya:
   "panah, Spasi dan Tab tidak memindahkan apa pun" (board.js:73-82). */
.move-pop { margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px dashed var(--border-strong); display: grid; gap: 2px; }
.move-pop b { font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.move-opt { display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; border: 0; border-radius: var(--radius-sm); background: transparent; padding: 5px 7px; font: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.move-opt:hover { background: var(--surface-hover); color: var(--text); }
.move-opt[aria-disabled="true"] { color: var(--muted); cursor: not-allowed; }
.move-opt kbd { margin-left: auto; font: inherit; font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 4px; }

/* -------------------------------------------------- layar lapangan */
/* Dirancang dari batasan fisik: satu tangan bebas, di bawah matahari,
   sarung tangan. Sasaran sentuh besar, kontras tinggi, dan jarak foto
   ke titik proyek diberi ANGKA, bukan hanya warna. */
.device { width: 360px; max-width: 100%; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
.device-bar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: var(--fs-secondary); color: var(--muted); }
.device-body { padding: var(--space-3); display: grid; gap: var(--space-3); }
.btn.field { height: 52px; font-size: 15px; font-weight: var(--fw-semi); width: 100%; }
.btn.field svg { width: 20px; height: 20px; }
.gps { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--fs-body); }
.gps.near { background: var(--success-soft); color: var(--success); }
.gps.far { background: var(--warning-soft); color: var(--warning); }
.gps b { font-variant-numeric: tabular-nums; }
.photo-slot { aspect-ratio: 4/3; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: var(--fs-secondary); text-align: center; padding: var(--space-3); }
.queue-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-secondary); }
.queue-item:last-child { border-bottom: 0; }

/* ------------------------------------------------- keadaan sistem */
.state-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.state-box { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); }
.state-box > .lbl { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.state-body { padding: var(--space-5) var(--space-4); display: grid; place-items: center; min-height: 250px; }
.auth-card { width: 100%; max-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); display: grid; gap: var(--space-3); }
.auth-card .brand-mark { margin: 0 auto; }
.auth-card h3 { font-size: var(--fs-section); text-align: center; }
.boot-failed-demo { max-width: 320px; font-size: var(--fs-body); line-height: 1.55; color: var(--text); }
.boot-failed-demo h3 { font-size: 15px; margin-bottom: var(--space-2); }
.boot-failed-demo p { color: var(--text-2); margin-bottom: var(--space-3); }
</script>
<script id="doc-css-10" type="text/plain">
/* ===================== POLA YANG TERSISA: PANEL, MATRIKS, PEMBANGUN
   LAPORAN, GANTT, DAN KERTAS
   Lima keluarga terakhir yang belum punya jawaban rancangan. Sesudah
   ini tidak ada pola bersama yang belum digambar — sisanya pekerjaan
   MENERAPKAN sistem ini pada layar yang sudah ada, bukan merancang
   sesuatu yang baru. */

/* ------------------------------------------------- panel & dialog */
.spec-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; }
.spec { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); min-width: 0; }
.spec > .lbl { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.spec > .lbl svg { width: 13px; height: 13px; }
.spec-body { padding: var(--space-4); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.panel-head h3 { font-size: var(--fs-section); font-weight: var(--fw-semi); }
.panel-body { padding: var(--space-4); display: grid; gap: var(--space-3); }
.panel-foot { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); background: var(--surface-2); }

/* pemberitahuan */
.notif { display: grid; gap: 3px; padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
.notif:last-child { border-bottom: 0; }
.notif.unread { border-left: 2px solid var(--primary); padding-left: var(--space-3); margin-left: calc(var(--space-3) * -1 - 2px); }
.notif-head { display: flex; align-items: center; gap: var(--space-2); }
.notif-title { font-size: var(--fs-body); font-weight: var(--fw-semi); }
.notif-body { font-size: var(--fs-secondary); color: var(--text-2); }

/* laci atur dasbor */
.drawer-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 10px; border: 1px solid var(--border); border-left: 3px solid var(--module-accent, var(--border-strong)); border-radius: var(--radius-sm); background: var(--surface); }
.drawer-row + .drawer-row { margin-top: 6px; }
.drawer-row .grip { color: var(--muted); cursor: grab; display: flex; }
.drawer-row .nm { min-width: 0; flex: 1; }
.drawer-row .nm b { display: block; font-size: 12.5px; font-weight: var(--fw-semi); }
.drawer-row.spare { border-left-color: var(--border); background: var(--surface-2); }
.drawer-row select { width: auto; min-width: 92px; height: 28px; font-size: 12px; }

/* panduan onboarding */
.onb-step { display: flex; align-items: flex-start; gap: var(--space-2); padding: 6px 0; font-size: var(--fs-body); color: var(--text-2); }
.onb-step .n { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: var(--fw-bold); background: var(--surface-3); color: var(--muted); }
.onb-step.done .n { background: var(--success-soft); color: var(--success); }
.onb-step.current { color: var(--text); font-weight: var(--fw-semi); }
.onb-step.current .n { background: var(--primary); color: var(--primary-fg); }

/* --------------------------------------------- matriks persetujuan */
/* Satu grup pengaturan digambar sebagai TABEL, bukan kolom field: 28
   jenis dokumen x (ambang, mode, tingkat ketiga). Selnya kontrol biasa
   dalam mode ringkas, jadi Simpan, Batalkan, galat per field dan
   "Kembalikan ke bawaan" bekerja tanpa jalur simpan kedua. */
table.matrix { width: 100%; border-collapse: collapse; font-size: var(--fs-table); }
table.matrix th {
  position: sticky; top: 0; z-index: 1; text-align: left; white-space: nowrap;
  padding: var(--cell-py) var(--cell-px); background: var(--surface-2);
  border-bottom: 1px solid var(--border-strong);
  font-size: var(--fs-caption); font-weight: var(--fw-bold);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
table.matrix td { padding: 5px var(--cell-px); border-bottom: 1px solid var(--border); vertical-align: middle; }
table.matrix tbody tr:hover { background: var(--surface-2); }
table.matrix input, table.matrix select { height: 30px; font-size: 12.5px; }
table.matrix .doc { font-weight: var(--fw-medium); }
table.matrix .doc small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
/* Baris yang membawa ATURAN, bukan kontrol — tidak pernah Rp 0 palsu. */
.ruled { font-size: 12.5px; color: var(--muted); font-style: italic; }

/* ------------------------------------------- pembangun laporan */
.builder { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.pick-list { display: grid; gap: 2px; }
.pick-opt {
  display: flex; align-items: flex-start; gap: var(--space-2);
  padding: 6px var(--space-2); border-radius: var(--radius-sm); font-size: 12.5px;
}
.pick-opt:hover { background: var(--surface-hover); }
.pick-opt input { margin-top: 2px; flex: none; }
.pick-opt .t { min-width: 0; }
.pick-opt.off { color: var(--muted); }
.pick-opt.off .why { display: block; font-size: 11px; color: var(--danger); }
.ceiling { font-size: 11.5px; color: var(--muted); padding-top: var(--space-2); border-top: 1px dashed var(--border-strong); margin-top: var(--space-2); }
@media (max-width: 900px) { .builder { grid-template-columns: minmax(0, 1fr); } }

/* --------------------------------------------------------- gantt */
.gantt-scroll { overflow-x: auto; }
.gantt-scroll svg { display: block; min-width: 680px; }
.gantt-scroll text { fill: var(--chart-text); font-family: var(--font); font-size: 11px; }

/* --------------------------------------------------------- kertas */
/* Cetak adalah satu-satunya cara laporan keuangan keluar dari aplikasi
   ini, jadi lembarnya dirancang, bukan disisakan. Blok @media print
   menyembunyikan nav, header, bilah aksi, filter, tab dan pager; yang
   TERSISA inilah yang orang pegang. */
.paper {
  width: 640px; max-width: 100%; margin: 0 auto;
  background: #ffffff; color: #14181d;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: var(--space-7) var(--space-6);
  font-size: 12px; line-height: 1.5;
  box-shadow: var(--shadow-md);
}
.paper .ph { display: flex; align-items: flex-start; gap: var(--space-4); border-bottom: 2px solid #14181d; padding-bottom: var(--space-3); }
.paper .ph .co b { display: block; font-size: 14px; }
.paper .ph .co span { display: block; font-size: 11px; color: #47505b; }
.paper .ph .dt { margin-left: auto; text-align: right; }
.paper .ph .dt b { display: block; font-size: 13px; }
.paper .ph .dt span { display: block; font-size: 11px; color: #47505b; font-family: var(--mono); }
.paper h4 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5e6874; margin: var(--space-5) 0 var(--space-2); }
.paper table { width: 100%; border-collapse: collapse; font-size: 11.5px; }

<script>
(function () {
  var pick = function (sel, doc) { return (doc || document).querySelector(sel); };
  var all  = function (sel, doc) { return [].slice.call((doc || document).querySelectorAll(sel)); };
  var textOf = function (nodes) { return nodes.map(function (n) { return n.textContent; }).join('\n'); };

  var CSS   = textOf(all('script[id^="doc-css"]'));
  var SHELL = textOf(all('script[id^="doc-html"]'));

  var SCREENS = [
    { id: 'beranda',  label: 'Beranda (launcher)', group: 'Orientasi',
      crumbs: [{ t: 'Ringkasan', a: 8 }, { t: 'Beranda' }], nav: 'beranda' },
    { id: 'dasbor',   label: 'Dasbor', group: 'Orientasi',
      crumbs: [{ t: 'Ringkasan', a: 8 }, { t: 'Dasbor' }], nav: 'dasbor' },
    { id: 'modul',    label: 'Beranda modul', group: 'Orientasi',
      crumbs: [{ t: 'Keuangan', a: 2 }], nav: 'modul' },

    { id: 'daftar',   label: 'Daftar generik', group: 'Sumber daya generik',
      crumbs: [{ t: 'Pengadaan', a: 3 }, { t: 'Pesanan Pembelian' }], nav: 'po' },
    { id: 'dokumen',  label: 'Dokumen generik', group: 'Sumber daya generik',
      crumbs: [{ t: 'Pengadaan', a: 3 }, { t: 'Pesanan Pembelian', link: 1 }, { t: 'PO/2026/IX/0042' }], nav: 'po' },
    { id: 'formulir', label: 'Formulir (halaman penuh)', group: 'Sumber daya generik',
      crumbs: [{ t: 'Pengadaan', a: 3 }, { t: 'Pesanan Pembelian', link: 1 }, { t: 'Baru' }], nav: 'po' },

    { id: 'tugas',    label: 'Alur persetujuan', group: 'Alur kerja',
      crumbs: [{ t: 'Ringkasan', a: 8 }, { t: 'Tugas Saya' }], nav: 'tugas' },

    { id: 'proyek',   label: 'Workspace proyek', group: 'Domain',
      crumbs: [{ t: 'Proyek', a: 1 }, { t: 'Daftar Proyek', link: 1 }, { t: 'Data Center Jakarta' }], nav: 'proyek' },
    { id: 'laporan',  label: 'Laporan — umur piutang', group: 'Domain',
      crumbs: [{ t: 'Keuangan', a: 2 }, { t: 'Umur Piutang' }], nav: 'lap' },
    { id: 'labarugi', label: 'Laporan — laba rugi', group: 'Domain',
      crumbs: [{ t: 'Keuangan', a: 2 }, { t: 'Laba Rugi' }], nav: 'lap' },

    { id: 'papan',    label: 'Papan kanban', group: 'Alur kerja',
      crumbs: [{ t: 'Pengadaan', a: 3 }, { t: 'Papan Permintaan' }], nav: 'po' },
    { id: 'lapangan', label: 'Lapangan (ponsel)', group: 'Domain',
      crumbs: [{ t: 'Proyek', a: 1 }, { t: 'Lapangan' }], nav: 'proyek' },

    { id: 'matriks',  label: 'Matriks persetujuan', group: 'Pengaturan & laporan',
      crumbs: [{ t: 'Sistem', a: 8 }, { t: 'Matriks Persetujuan' }], nav: 'komponen' },
    { id: 'pembangun', label: 'Laporan Bebas', group: 'Pengaturan & laporan',
      crumbs: [{ t: 'Ringkasan', a: 8 }, { t: 'Laporan Bebas' }], nav: 'tugas' },
    { id: 'jadwal',   label: 'Jadwal (gantt)', group: 'Domain',
      crumbs: [{ t: 'Proyek', a: 1 }, { t: 'Daftar Proyek', link: 1 }, { t: 'Jadwal' }], nav: 'proyek' },
    { id: 'cetak',    label: 'Lembar cetak', group: 'Pengaturan & laporan',
      crumbs: [{ t: 'Pengadaan', a: 3 }, { t: 'Pesanan Pembelian', link: 1 }, { t: 'Cetak' }], nav: 'po' },
    { id: 'panel',    label: 'Panel & dialog', group: 'Sistem desain',
      crumbs: [{ t: 'Sistem', a: 8 }, { t: 'Panel & Dialog' }], nav: 'komponen' },

    { id: 'navigasi', label: 'Navigasi & pencarian', group: 'Masih terbuka',
      crumbs: [{ t: 'Sistem', a: 8 }, { t: 'Navigasi' }], nav: 'komponen' },
    { id: 'keadaan',  label: 'Keadaan sistem', group: 'Masih terbuka',
      crumbs: [{ t: 'Sistem', a: 8 }, { t: 'Keadaan Sistem' }], nav: 'komponen' },
    { id: 'komponen', label: 'Spesimen komponen', group: 'Sistem desain',
      crumbs: [{ t: 'Sistem', a: 8 }, { t: 'Komponen' }], nav: 'komponen' }
  ];

  var state = { theme: 'light', density: 'normal', width: '1440', screen: 'dasbor' };
  var frame = pick('#frame');
  var app   = pick('#app');

  /* ---- indeks layar ------------------------------------------------ */
  var idx = pick('#idx'), lastGroup = null;
  SCREENS.forEach(function (s) {
    if (s.group !== lastGroup) {
      var b = document.createElement('b');
      b.textContent = s.group;
      idx.appendChild(b);
      lastGroup = s.group;
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = s.label;
    btn.dataset.screen = s.id;
    btn.setAttribute('aria-current', String(s.id === state.screen));
    btn.addEventListener('click', function () { show(s.id); });
    idx.appendChild(btn);
  });

  /* ---- dokumen prototipe ------------------------------------------- */
  app.srcdoc = '<!DOCTYPE html><html lang="id" data-theme="light" data-density="normal">'
    + '<head><meta charset="utf-8"><style>' + CSS + '</style></head>'
    + '<body>' + SHELL + '</body></html>';

  app.addEventListener('load', function () {
    var doc = app.contentDocument;
    if (!doc) return;
    applyTheme(); applyDensity();

    var toggle = pick('#menu-toggle', doc);
    if (toggle) toggle.addEventListener('click', function () { doc.body.classList.toggle('nav-open'); });

    all('.nav-group > button', doc).forEach(function (b) {
      b.addEventListener('click', function () {
        var g = b.parentNode;
        g.dataset.open = g.dataset.open === 'true' ? 'false' : 'true';
      });
    });

    all('.nav-items a', doc).forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        doc.body.classList.remove('nav-open');
        if (a.dataset.goto) show(a.dataset.goto);
      });
    });

    var cmdk = pick('#cmdk', doc);
    if (cmdk) cmdk.addEventListener('click', function () { show('beranda'); });

    show(state.screen);
  });

  /* ---- menggambar satu layar --------------------------------------- */
  function show(id) {
    var s = SCREENS.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    state.screen = id;
    all('#idx button').forEach(function (b) { b.setAttribute('aria-current', String(b.dataset.screen === id)); });

    var doc = app.contentDocument;
    if (!doc) return;
    var view = pick('#view', doc);
    var src = pick('#scr-' + id);
    if (!view || !src) return;

    view.innerHTML = src.textContent;
    view.scrollTop = 0;
    paintCrumbs(doc, s.crumbs);
    markNav(doc, s.nav);

    all('table.data td.pick-opt input', doc).forEach(function (box) {
      box.addEventListener('change', function () {
        var tr = box.closest('tr');
        if (tr) tr.classList.toggle('selected', box.checked);
      });
    });
  }

  function paintCrumbs(doc, parts) {
    var host = pick('#crumbs', doc);
    if (!host) return;
    host.innerHTML = '';
    host.dataset.accent = String((parts[0] && parts[0].a) || 8);
    parts.forEach(function (p, i) {
      var last = i === parts.length - 1;
      var node;
      if (last) {
        node = doc.createElement('b');
        node.setAttribute('aria-current', 'page');
      } else {
        node = doc.createElement('a');
        node.href = '#';
        node.className = p.a ? 'crumb-module' : 'crumb-screen';
      }
      node.textContent = p.t;
      host.appendChild(node);
    });
  }

  function markNav(doc, key) {
    all('.nav-group', doc).forEach(function (g) { g.classList.remove('has-active'); });
    all('.nav-items a', doc).forEach(function (a) { a.classList.remove('active'); });
    if (!key) return;
    var link = pick('.nav-items a[data-nav="' + key + '"]', doc) || pick('.nav-items a[data-goto="' + key + '"]', doc);
    if (!link) return;
    link.classList.add('active');
    var group = link.closest('.nav-group');
    if (group) { group.dataset.open = 'true'; group.classList.add('has-active'); }
  }

  /* ---- kontrol peninjauan ------------------------------------------ */
  function applyTheme() {
    var doc = app.contentDocument;
    if (!doc) return;
    var root = doc.documentElement;
    if (state.theme === 'system') {
      root.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } else {
      root.dataset.theme = state.theme;
    }
  }
  function applyDensity() {
    var doc = app.contentDocument;
    if (doc) doc.documentElement.dataset.density = state.density;
  }

  function wireSeg(id, key, after) {
    all('#' + id + ' button').forEach(function (b) {
      b.addEventListener('click', function () {
        state[key] = b.dataset.v;
        all('#' + id + ' button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        after();
      });
    });
  }
  wireSeg('seg-theme', 'theme', applyTheme);
  wireSeg('seg-density', 'density', applyDensity);
  wireSeg('seg-width', 'width', function () {
    frame.className = 'frame w' + state.width;
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (state.theme === 'system') applyTheme();
  });
})();
</script>
