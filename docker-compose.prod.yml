# Production compose stack for the Nusantara Construction ERP.
#
#   cp .env.production.example .env   # then fill in every placeholder
#   docker compose -f docker-compose.prod.yml up -d --build
#
# TLS terminates OUTSIDE this stack: nginx listens plain HTTP and is bound to
# 127.0.0.1:${HTTP_PORT:-8080} so only a host reverse proxy (Caddy, Traefik,
# or certbot-managed nginx) can front it. See the commented caddy service at
# the bottom for a containerized automatic-TLS alternative.
#
# One-time production seeding (master data + roles + admin from ERP_ADMIN_*):
#   docker compose -f docker-compose.prod.yml exec app \
#       php artisan db:seed --class=ProductionSeeder --force

name: construction-erp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: construction-erp-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # The app container is the ONLY service allowed to run migrations at
      # boot (set RUN_MIGRATIONS=1 in .env to enable; queue/scheduler force
      # it off below so concurrent starts never race).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    volumes:
      # Uploaded files / generated documents survive container replacement
      # and are shared with the queue worker (Excel/PDF jobs).
      - erp-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Loopback only — a host reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # Deploys are git-pull based, so the host checkout's public/ (front
      # controller + static files) is bind-mounted read-only. PHP itself
      # executes inside the app container from the image's copy.
      - ./public:/var/www/html/public:ro

  queue:
    image: construction-erp-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - erp-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Let an in-flight job finish before SIGKILL on deploy/restart.
    stop_grace_period: 60s

  scheduler:
    image: construction-erp-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - erp-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erp_construction}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Distinct root password recommended; falls back to DB_PASSWORD.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set in .env}}
    volumes:
      - erp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- Optional: containerized automatic TLS (alternative to a host proxy) --
  # Uncomment (and the two caddy volumes below) to let Caddy obtain/renew
  # Let's Encrypt certificates itself. Set ERP_DOMAIN in .env. The nginx
  # 127.0.0.1 port mapping above can stay — Caddy reaches nginx over the
  # compose network, not via the host port.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   depends_on:
  #     - nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     ERP_DOMAIN: ${ERP_DOMAIN:?set ERP_DOMAIN in .env}
  #   command: >
  #     sh -c 'printf "%s {\n\treverse_proxy nginx:80\n}\n" "$$ERP_DOMAIN"
  #     > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile'
  #   volumes:
  #     - erp-caddy-data:/data
  #     - erp-caddy-config:/config

volumes:
  erp-mysql-data:
  erp-redis-data:
  erp-storage:
  # erp-caddy-data:
  # erp-caddy-config:
