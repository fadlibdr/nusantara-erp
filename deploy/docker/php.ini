; Production PHP overrides for the ERP image.
; Loaded as /usr/local/etc/php/conf.d/zz-erp.ini on top of php.ini-production.

; --- Identification / errors -------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; No deprecation/notice spam in production logs.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; --- Limits ------------------------------------------------------------------
; 512M headroom for phpspreadsheet (Excel exports) and dompdf rendering.
memory_limit = 512M
; Uploads: drawings, foto lapangan, invoices. Keep post_max_size slightly
; larger than upload_max_filesize; nginx client_max_body_size matches (26m).
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 120
max_input_vars = 5000

; --- Timezone ----------------------------------------------------------------
; Resolved from the TZ environment variable; the image sets TZ=Asia/Jakarta
; as the fallback (see Dockerfile), override via .env if ever needed.
date.timezone = ${TZ}

; --- OPcache -----------------------------------------------------------------
; validate_timestamps=0: code is immutable inside the image; deploys replace
; the container, so never stat files. (Do NOT bind-mount code over this.)
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

; --- Realpath cache ----------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Misc hardening ----------------------------------------------------------
cgi.fix_pathinfo = 0
allow_url_include = Off
