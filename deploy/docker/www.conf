; php-fpm pool for the ERP app container.
; Loaded as /usr/local/etc/php-fpm.d/zz-erp.conf, so it overrides both the
; stock www.conf and the base image's zz-docker.conf.
;
; The container runs as user "erp" (uid 1000) already — no user/group
; directives here (php-fpm ignores them when not started as root).

[www]
listen = 9000

; Modest sizing for a single-VM compose deploy. Worst case at
; pm.max_children=20 is ~20 workers; typical Laravel worker RSS is
; 60-120 MB, so budget ~2-3 GB RAM for PHP before raising this.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers to bound leaks from heavy libs (phpspreadsheet, dompdf).
pm.max_requests = 500

; Kill runaway requests a bit after PHP's own max_execution_time (120s);
; nginx fastcgi_read_timeout is aligned at 150s.
request_terminate_timeout = 150s

; Worker stdout/stderr must reach the container log (LOG_CHANNEL=stderr).
catch_workers_output = yes
decorate_workers_output = no

; Container env (DB_*, REDIS_*, APP_KEY, ...) must reach PHP.
clear_env = no

; Liveness endpoint for php-fpm itself (not routed by nginx; usable by a
; container healthcheck via cgi-fcgi if ever needed).
ping.path = /ping
ping.response = pong
