# nginx server block for the ERP (mounted as /etc/nginx/conf.d/default.conf).
#
# TLS terminates OUTSIDE this compose stack (host Caddy / Traefik / certbot
# nginx). This server listens plain HTTP on 80; compose maps it to
# 127.0.0.1:8080 so only the host reverse proxy can reach it. The proxy MUST
# forward X-Forwarded-Proto so Laravel and PHP see the original scheme.

# Translate X-Forwarded-Proto from the TLS-terminating proxy into the
# FastCGI HTTPS flag so $_SERVER['HTTPS'] / secure cookies behave.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Slightly above upload_max_filesize=25M (post_max_size=26M in php.ini).
    client_max_body_size 26m;

    # --- Security headers (API-only backend) --------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Compression (JSON API payloads) ------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/vnd.api+json text/plain text/css application/javascript application/xml;

    # --- Health check --------------------------------------------------------
    # Laravel's built-in /up endpoint (bootstrap/app.php: health: '/up').
    # Falls through to the front controller; kept quiet in access logs so
    # the host proxy / uptime monitor can poll it freely.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # --- Deny-list -----------------------------------------------------------
    # Hidden files: .env, .git, .htaccess, ...
    location ~ /\. {
        deny all;
    }

    # Never execute or serve PHP that ends up under the public storage
    # symlink (defense in depth for user uploads).
    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    # --- Routing -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The front controller is the ONLY PHP file that may execute.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Propagate the original scheme from the TLS-terminating proxy.
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 150s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other *.php request is refused outright.
    location ~ \.php$ {
        deny all;
    }
}
